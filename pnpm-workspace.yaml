packages:
  - packages/*/*
  - apps/*

# Security overrides: force patched versions of dev-only transitive deps
# flagged by Dependabot. All are build/test tooling, none ship to consumers.
overrides:
  undici: ^7.28.0
  vite: ^8.0.16
  esbuild: ^0.28.1
  fast-uri: ^3.1.2
  js-yaml@3: ^3.15.0

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

nodeLinker: hoisted

minimumReleaseAgeExclude:
  - '@vela-rbxts/compiler-darwin-arm64@0.6.0'
  - '@vela-rbxts/compiler-darwin-x64@0.6.0'
  - '@vela-rbxts/compiler-linux-arm64-gnu@0.6.0'
  - '@vela-rbxts/compiler-linux-x64-gnu@0.6.0'
  - '@vela-rbxts/compiler-linux-x64-musl@0.6.0'
  - '@vela-rbxts/compiler-win32-x64-msvc@0.6.0'
  - '@vela-rbxts/compiler@0.6.0'
  - '@vela-rbxts/config@0.6.0'
  - '@vela-rbxts/ir@0.6.0'
  - '@vela-rbxts/rbxtsc-host@0.6.0'
  - '@vela-rbxts/types@0.6.0'
  - vela-rbxts@0.6.0
